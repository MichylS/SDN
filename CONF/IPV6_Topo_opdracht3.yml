---
# Faucet-configuratie voor de dual-stack topologie van opdracht 3 (IPV6_Topo_opdracht3.py).
#
# STAP 1: IPv6 werkend per VLAN, nog ZONDER IPv6-firewall.
#   IPv4 is precies gelijk aan opdracht 2 (stateful firewall + PAT).
#   IPv6 wordt in elke ACL voorlopig helemaal doorgelaten (regel "IPv6 stap 1").
#   In stap 2 komen daar stateful IPv6-regels voor in de plaats.
#
# IPv6-adresplan (klantprefix 2001:db8:a::/48, 4e groep = VLAN-nummer):
#   VLAN 100 employee    2001:db8:a:100::/64   gateway ::1
#   VLAN 200 guest       2001:db8:a:200::/64   gateway ::1
#   VLAN 300 management  2001:db8:a:300::/64   gateway ::1
#   VLAN 500 ISP         2001:db8:a:500::/64   isp_a ::1, Faucet ::2, isp_b ::3
# De ISP-routers routeren 2001:db8:a::/48 naar Faucet (::2): geen NAT bij IPv6.
# Elk VLAN heeft ook de link-local gateway fe80::1/64. Faucet beantwoordt
# neighbor solicitations alleen als de afzender in een VIP-subnet ligt, en
# Linux controleert zijn buren met zijn link-local adres (fe80::) als bron.
# Zonder fe80::1 raakt de gateway na ~30 s 'FAILED' in de neighbor-cache.
#
# Faucet doet hier:
#   - VLAN-scheiding (employee 100, guest 200, management 300, ISP 500)
#   - routering tussen de VLAN's voor IPv4 en IPv6
#     (faucet_vips = gateway .1 en ::1 per VLAN)
#   - stacking tussen alle switches (Faucet kent de hele topologie)
#   - een stateful firewall met connection tracking (ct-ACL's)
#   - NAT (ct nat): verkeer naar internet krijgt bronadres 198.51.100.9
#   - port security op managementpoorten en 1 Mbit/s voor guests
# De ISP-routers isp_a en isp_b sturen alleen door; zij doen geen NAT.
#
# ct_state-waarden (OVS conntrack):
#   0/0x20     = nog niet gevolgd (-trk)
#   0x21/0x21  = gevolgd en nieuwe verbinding (+trk+new)
#   0x22/0x22  = gevolgd en bestaande verbinding (+trk+est)
#   0x24/0x24  = gevolgd en gerelateerd, bv. ICMP-fout (+trk+rel)
# ct-actie:
#   table: 0, nat: {}  = door conntrack en opnieuw door de poort-ACL (tabel 0);
#                        nat: {} past een bestaande NAT-vertaling toe (heen en terug)
#   table: 1, flags: 1 = verbinding vastleggen (commit) en verder door de Faucet-pipeline
#   nat: {flags: 1, range_ipv4_min/max: 198.51.100.9}
#                      = bij het vastleggen het bronadres omzetten (SNAT) naar 198.51.100.9
#
# Publiek blok 198.51.100.0/28, in twee helften:
#   198.51.100.0/29 = ISP-segment (VLAN 500): isp_a .1, Faucet .2, isp_b .3
#   198.51.100.8/29 = NAT-blok; de ISP-routers routeren dit naar Faucet (.2).
# Het NAT-adres ligt bewust buiten het VIP-subnet: Faucet leert elk bron-IP
# binnen een VIP-subnet als host. NAT naar .2 (de VIP zelf) liet Faucet zijn
# eigen adres als host leren, waarna ping naar .2 niet meer werkte.

meters:
    # Guest-verkeer wordt per poort beperkt tot 1 Mbit/s.
    guest-rate-limit:
        meter_id: 1
        entry:
            flags: [KBPS, BURST, STATS]
            bands:
                - type: DROP
                  rate: 1000
                  burst_size: 100

acls:
    # ------------------------------------------------------------------
    # Employee-poorten: mag naar internet, eigen VLAN en gateway.
    # Mag geen nieuwe verbindingen starten naar guest of management.
    # ------------------------------------------------------------------
    office-fw:
        - rule:
              description: "ARP toestaan"
              eth_type: 0x0806
              actions: {allow: 1}
        - rule:
              description: "IPv6 stap 1: alles doorlaten (stateful IPv6-regels volgen in stap 2)"
              eth_type: 0x86DD
              actions: {allow: 1}
        - rule:
              description: "Nog niet gevolgd -> door conntrack"
              eth_type: 0x0800
              ct_state: 0/0x20
              actions: {ct: {zone: 10, table: 0, nat: {}}}
        - rule:
              description: "Bestaande verbinding (antwoordverkeer)"
              eth_type: 0x0800
              ct_state: 0x22/0x22
              actions: {allow: 1}
        - rule:
              description: "Gerelateerd verkeer (ICMP-fouten)"
              eth_type: 0x0800
              ct_state: 0x24/0x24
              actions: {allow: 1}
        - rule:
              description: "Nieuw naar guest verboden"
              eth_type: 0x0800
              ct_state: 0x21/0x21
              ipv4_dst: 10.0.200.0/24
              actions: {allow: 0}
        - rule:
              description: "Nieuw naar management verboden"
              eth_type: 0x0800
              ct_state: 0x21/0x21
              ipv4_dst: 10.0.30.0/24
              actions: {allow: 0}
        - rule:
              description: "Nieuw naar intern (10.0.0.0/8): vastleggen, zonder NAT"
              eth_type: 0x0800
              ct_state: 0x21/0x21
              ipv4_dst: 10.0.0.0/8
              actions: {ct: {zone: 10, flags: 1, table: 1}}
        - rule:
              description: "Nieuw naar internet: vastleggen + SNAT naar 198.51.100.9"
              eth_type: 0x0800
              ct_state: 0x21/0x21
              actions: {ct: {zone: 10, flags: 1, table: 1, nat: {flags: 1, range_ipv4_min: 198.51.100.9, range_ipv4_max: 198.51.100.9}}}
        - rule:
              description: "Al het andere droppen"
              actions: {allow: 0}

    # ------------------------------------------------------------------
    # Guest-poorten: alleen naar internet (en de eigen gateway).
    # Geen verkeer naar interne netwerken, ook niet naar andere guests.
    # ------------------------------------------------------------------
    guest-fw:
        - rule:
              description: "ARP toestaan"
              eth_type: 0x0806
              actions: {allow: 1}
        - rule:
              description: "IPv6 stap 1: alles doorlaten, wel met 1 Mbit/s-limiet (firewall volgt in stap 2)"
              eth_type: 0x86DD
              actions: {allow: 1, meter: guest-rate-limit}
        - rule:
              description: "Nog niet gevolgd -> door conntrack"
              eth_type: 0x0800
              ct_state: 0/0x20
              actions: {ct: {zone: 10, table: 0, nat: {}}}
        - rule:
              description: "Bestaande verbinding, met 1 Mbit/s-limiet"
              eth_type: 0x0800
              ct_state: 0x22/0x22
              actions: {allow: 1, meter: guest-rate-limit}
        - rule:
              description: "Gerelateerd verkeer (ICMP-fouten)"
              eth_type: 0x0800
              ct_state: 0x24/0x24
              actions: {allow: 1, meter: guest-rate-limit}
        - rule:
              description: "Nieuw naar eigen gateway (ping .1)"
              eth_type: 0x0800
              ct_state: 0x21/0x21
              ipv4_dst: 10.0.200.1/32
              actions: {ct: {zone: 10, flags: 1, table: 1}}
        - rule:
              description: "Nieuw naar alle interne netwerken verboden (ook andere guests)"
              eth_type: 0x0800
              ct_state: 0x21/0x21
              ipv4_dst: 10.0.0.0/8
              actions: {allow: 0}
        - rule:
              description: "Nieuw naar internet: vastleggen + SNAT naar 198.51.100.9"
              eth_type: 0x0800
              ct_state: 0x21/0x21
              actions: {ct: {zone: 10, flags: 1, table: 1, nat: {flags: 1, range_ipv4_min: 198.51.100.9, range_ipv4_max: 198.51.100.9}}}
        - rule:
              description: "Al het andere droppen"
              actions: {allow: 0}

    # ------------------------------------------------------------------
    # Management-poorten: port security (alleen het vaste MAC-adres) en
    # stateful firewall. Mag naar employee, eigen VLAN en internet,
    # niet naar guest. Elke regel matcht op het vaste bron-MAC.
    # ------------------------------------------------------------------
    mgt-fw-a1:
        - rule: {eth_src: "02:00:00:00:30:11", eth_type: 0x0806, actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:11", eth_type: 0x86DD, actions: {allow: 1}}   # IPv6 stap 1
        - rule: {eth_src: "02:00:00:00:30:11", eth_type: 0x0800, ct_state: 0/0x20,
                 actions: {ct: {zone: 10, table: 0, nat: {}}}}
        - rule: {eth_src: "02:00:00:00:30:11", eth_type: 0x0800, ct_state: 0x22/0x22,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:11", eth_type: 0x0800, ct_state: 0x24/0x24,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:11", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.200.0/24, actions: {allow: 0}}
        - rule: {eth_src: "02:00:00:00:30:11", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.0.0/8, actions: {ct: {zone: 10, flags: 1, table: 1}}}
        - rule: {eth_src: "02:00:00:00:30:11", eth_type: 0x0800, ct_state: 0x21/0x21,
                 actions: {ct: {zone: 10, flags: 1, table: 1,
                           nat: {flags: 1, range_ipv4_min: 198.51.100.9, range_ipv4_max: 198.51.100.9}}}}
        - rule: {description: "Ander MAC-adres of ander verkeer: droppen", actions: {allow: 0}}
    mgt-fw-a2:
        - rule: {eth_src: "02:00:00:00:30:12", eth_type: 0x0806, actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:12", eth_type: 0x86DD, actions: {allow: 1}}   # IPv6 stap 1
        - rule: {eth_src: "02:00:00:00:30:12", eth_type: 0x0800, ct_state: 0/0x20,
                 actions: {ct: {zone: 10, table: 0, nat: {}}}}
        - rule: {eth_src: "02:00:00:00:30:12", eth_type: 0x0800, ct_state: 0x22/0x22,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:12", eth_type: 0x0800, ct_state: 0x24/0x24,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:12", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.200.0/24, actions: {allow: 0}}
        - rule: {eth_src: "02:00:00:00:30:12", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.0.0/8, actions: {ct: {zone: 10, flags: 1, table: 1}}}
        - rule: {eth_src: "02:00:00:00:30:12", eth_type: 0x0800, ct_state: 0x21/0x21,
                 actions: {ct: {zone: 10, flags: 1, table: 1,
                           nat: {flags: 1, range_ipv4_min: 198.51.100.9, range_ipv4_max: 198.51.100.9}}}}
        - rule: {description: "Ander MAC-adres of ander verkeer: droppen", actions: {allow: 0}}
    mgt-fw-b1:
        - rule: {eth_src: "02:00:00:00:30:21", eth_type: 0x0806, actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:21", eth_type: 0x86DD, actions: {allow: 1}}   # IPv6 stap 1
        - rule: {eth_src: "02:00:00:00:30:21", eth_type: 0x0800, ct_state: 0/0x20,
                 actions: {ct: {zone: 10, table: 0, nat: {}}}}
        - rule: {eth_src: "02:00:00:00:30:21", eth_type: 0x0800, ct_state: 0x22/0x22,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:21", eth_type: 0x0800, ct_state: 0x24/0x24,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:21", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.200.0/24, actions: {allow: 0}}
        - rule: {eth_src: "02:00:00:00:30:21", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.0.0/8, actions: {ct: {zone: 10, flags: 1, table: 1}}}
        - rule: {eth_src: "02:00:00:00:30:21", eth_type: 0x0800, ct_state: 0x21/0x21,
                 actions: {ct: {zone: 10, flags: 1, table: 1,
                           nat: {flags: 1, range_ipv4_min: 198.51.100.9, range_ipv4_max: 198.51.100.9}}}}
        - rule: {description: "Ander MAC-adres of ander verkeer: droppen", actions: {allow: 0}}
    mgt-fw-b2:
        - rule: {eth_src: "02:00:00:00:30:22", eth_type: 0x0806, actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:22", eth_type: 0x86DD, actions: {allow: 1}}   # IPv6 stap 1
        - rule: {eth_src: "02:00:00:00:30:22", eth_type: 0x0800, ct_state: 0/0x20,
                 actions: {ct: {zone: 10, table: 0, nat: {}}}}
        - rule: {eth_src: "02:00:00:00:30:22", eth_type: 0x0800, ct_state: 0x22/0x22,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:22", eth_type: 0x0800, ct_state: 0x24/0x24,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:22", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.200.0/24, actions: {allow: 0}}
        - rule: {eth_src: "02:00:00:00:30:22", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.0.0/8, actions: {ct: {zone: 10, flags: 1, table: 1}}}
        - rule: {eth_src: "02:00:00:00:30:22", eth_type: 0x0800, ct_state: 0x21/0x21,
                 actions: {ct: {zone: 10, flags: 1, table: 1,
                           nat: {flags: 1, range_ipv4_min: 198.51.100.9, range_ipv4_max: 198.51.100.9}}}}
        - rule: {description: "Ander MAC-adres of ander verkeer: droppen", actions: {allow: 0}}
    mgt-fw-b3:
        - rule: {eth_src: "02:00:00:00:30:23", eth_type: 0x0806, actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:23", eth_type: 0x86DD, actions: {allow: 1}}   # IPv6 stap 1
        - rule: {eth_src: "02:00:00:00:30:23", eth_type: 0x0800, ct_state: 0/0x20,
                 actions: {ct: {zone: 10, table: 0, nat: {}}}}
        - rule: {eth_src: "02:00:00:00:30:23", eth_type: 0x0800, ct_state: 0x22/0x22,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:23", eth_type: 0x0800, ct_state: 0x24/0x24,
                 actions: {allow: 1}}
        - rule: {eth_src: "02:00:00:00:30:23", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.200.0/24, actions: {allow: 0}}
        - rule: {eth_src: "02:00:00:00:30:23", eth_type: 0x0800, ct_state: 0x21/0x21,
                 ipv4_dst: 10.0.0.0/8, actions: {ct: {zone: 10, flags: 1, table: 1}}}
        - rule: {eth_src: "02:00:00:00:30:23", eth_type: 0x0800, ct_state: 0x21/0x21,
                 actions: {ct: {zone: 10, flags: 1, table: 1,
                           nat: {flags: 1, range_ipv4_min: 198.51.100.9, range_ipv4_max: 198.51.100.9}}}}
        - rule: {description: "Ander MAC-adres of ander verkeer: droppen", actions: {allow: 0}}

    # ------------------------------------------------------------------
    # ISP-poorten (a_core p4, b_core p5): alleen antwoorden op verbindingen
    # die van binnen zijn gestart. De opzoekregel (nat: {}) zet het
    # doeladres 198.51.100.9 van een antwoord terug naar het privé-adres.
    # Nieuwe verbindingen van buiten worden gedropt, behalve ping vanuit het
    # ISP-segment naar Faucet .2 (Faucet beantwoordt een ping naar zijn VIP
    # sowieso alleen vanuit het direct aangesloten subnet).
    # ------------------------------------------------------------------
    isp-uplink:
        - rule:
              description: "ARP toestaan"
              eth_type: 0x0806
              actions: {allow: 1}
        - rule:
              description: "IPv6 stap 1: alles doorlaten (stateful IPv6-regels volgen in stap 2)"
              eth_type: 0x86DD
              actions: {allow: 1}
        - rule:
              description: "Nog niet gevolgd -> door conntrack"
              eth_type: 0x0800
              ct_state: 0/0x20
              actions: {ct: {zone: 10, table: 0, nat: {}}}
        - rule:
              description: "Antwoord op verbinding van binnen"
              eth_type: 0x0800
              ct_state: 0x22/0x22
              actions: {allow: 1}
        - rule:
              description: "Gerelateerd verkeer (ICMP-fouten)"
              eth_type: 0x0800
              ct_state: 0x24/0x24
              actions: {allow: 1}
        - rule:
              description: "Nieuw van buiten: alleen ping vanuit het ISP-segment naar Faucet .2"
              eth_type: 0x0800
              ct_state: 0x21/0x21
              ip_proto: 1
              ipv4_src: 198.51.100.0/29
              ipv4_dst: 198.51.100.2/32
              actions: {ct: {zone: 10, flags: 1, table: 1}}
        - rule:
              description: "Nieuwe verbinding van buiten naar binnen: droppen"
              actions: {allow: 0}

    # ------------------------------------------------------------------
    # Alle stackpoorten, alleen voor IPv6.
    # Faucet maakt zelf IPv6-pakketten met een gateway-adres als bron:
    # neighbor solicitations (NS) en antwoorden (NA). In een stack gaan die
    # ook over de stackpoorten naar andere switches. Daar is het MAC van Faucet
    # geen bekende bron, dus gaat het pakket naar de controller, en Faucet
    # leert dan zijn EIGEN gateway-adres als host (route naar 0e:00:00:00:00:01).
    # Daarna komen antwoorden en pings aan de gateway nooit meer bij Faucet aan.
    # Bij IPv4 speelt dit niet: ARP is geen IP-pakket.
    # Deze ACL houdt alleen pakketten tegen die van Faucet zelf komen EN een
    # gateway-adres als bron hebben. Gerouteerd verkeer (bron = host) mag door.
    # Gevolg: een switch kan een buur op een andere switch niet zelf opzoeken;
    # hij leert hem wanneer de switch van die buur hem opzoekt (Faucet verspreidt
    # dat antwoord over de stack). Daarom staat nd_neighbor_timeout op 5 s.
    # ------------------------------------------------------------------
    stack-faucet-v6:
        - rule: {description: "Faucet-pakket van gateway VLAN 100", eth_type: 0x86DD,
                 eth_src: "0e:00:00:00:00:01", ipv6_src: "2001:db8:a:100::1", actions: {allow: 0}}
        - rule: {description: "Faucet-pakket van gateway VLAN 200", eth_type: 0x86DD,
                 eth_src: "0e:00:00:00:00:01", ipv6_src: "2001:db8:a:200::1", actions: {allow: 0}}
        - rule: {description: "Faucet-pakket van gateway VLAN 300", eth_type: 0x86DD,
                 eth_src: "0e:00:00:00:00:01", ipv6_src: "2001:db8:a:300::1", actions: {allow: 0}}
        - rule: {description: "Faucet-pakket van gateway ISP-segment", eth_type: 0x86DD,
                 eth_src: "0e:00:00:00:00:01", ipv6_src: "2001:db8:a:500::2", actions: {allow: 0}}
        - rule: {description: "Faucet-pakket van link-local gateway", eth_type: 0x86DD,
                 eth_src: "0e:00:00:00:00:01", ipv6_src: "fe80::1", actions: {allow: 0}}
        - rule: {description: "Al het andere stackverkeer doorlaten", actions: {allow: 1}}

vlans:
    office:
        vid: 100
        description: "Employee 10.0.100.0/23, 2001:db8:a:100::/64"
        faucet_vips: ["10.0.100.1/23", "2001:db8:a:100::1/64", "fe80::1/64"]
    guest:
        vid: 200
        description: "Guest 10.0.200.0/24, 2001:db8:a:200::/64"
        faucet_vips: ["10.0.200.1/24", "2001:db8:a:200::1/64", "fe80::1/64"]
    management:
        vid: 300
        description: "Management 10.0.30.0/24, 2001:db8:a:300::/64"
        faucet_vips: ["10.0.30.1/24", "2001:db8:a:300::1/64", "fe80::1/64"]
    isp:
        vid: 500
        description: "ISP-segment 198.51.100.0/29 + 2001:db8:a:500::/64 (isp_a 1, Faucet 2, isp_b 3)"
        faucet_vips: ["198.51.100.2/29", "2001:db8:a:500::2/64", "fe80::1/64"]
        routes:
            - route:
                  ip_dst: "0.0.0.0/0"
                  ip_gw: "198.51.100.1"
            - route:
                  ip_dst: "::/0"
                  ip_gw: "2001:db8:a:500::1"

routers:
    # Routering tussen alle VLAN's, voor IPv4 en IPv6; de ACL's bepalen wat mag.
    intern:
        vlans: [office, guest, management, isp]

dps:
    a_core:
        dp_id: 0x1
        hardware: "Open vSwitch"
        nd_neighbor_timeout: 5   # IPv6-buren elke 5 s opnieuw opzoeken (standaard 30), zie stack-faucet-v6
        stack:
            priority: 1     # stack-root
        interfaces:
            1:
                description: "Stack naar a_f1"
                stack: {dp: a_f1, port: 1}
                acls_in: [stack-faucet-v6]
            2:
                description: "Stack naar a_f2"
                stack: {dp: a_f2, port: 1}
                acls_in: [stack-faucet-v6]
            3:
                description: "Darkfiber naar b_core"
                stack: {dp: b_core, port: 4}
                acls_in: [stack-faucet-v6]
            4:
                description: "ISP-router A (isp_a)"
                native_vlan: isp
                acls_in: [isp-uplink]

    a_f1:
        dp_id: 0x2
        hardware: "Open vSwitch"
        nd_neighbor_timeout: 5   # IPv6-buren elke 5 s opnieuw opzoeken (standaard 30), zie stack-faucet-v6
        interfaces:
            1:
                description: "Stack naar a_core"
                stack: {dp: a_core, port: 1}
                acls_in: [stack-faucet-v6]
            2:
                description: "Employee a1_emp"
                native_vlan: office
                acls_in: [office-fw]
            3:
                description: "Guest a1_gst"
                native_vlan: guest
                acls_in: [guest-fw]
            4:
                description: "Management a1_mgt"
                native_vlan: management
                acls_in: [mgt-fw-a1]

    a_f2:
        dp_id: 0x3
        hardware: "Open vSwitch"
        nd_neighbor_timeout: 5   # IPv6-buren elke 5 s opnieuw opzoeken (standaard 30), zie stack-faucet-v6
        interfaces:
            1:
                description: "Stack naar a_core"
                stack: {dp: a_core, port: 2}
                acls_in: [stack-faucet-v6]
            2:
                description: "Employee a2_emp"
                native_vlan: office
                acls_in: [office-fw]
            3:
                description: "Guest a2_gst"
