---
# Faucet-configuratie voor drie gescheiden netwerken:
# employee (kantoor), guest (bezoekers) en management.
# De VLAN's worden door de core- en verdiepingsswitches getagd
# doorgestuurd naar de router/gateway.
meters:
    # Guest-verkeer wordt per switchpoort beperkt tot 1 Mbit/s.
    guest-rate-limit:
        meter_id: 1
        entry:
            flags: [KBPS, BURST, STATS]
            bands:
                - type: DROP
                  rate: 1000
                  burst_size: 100

acls:
    # ACL's worden toegepast op inkomend verkeer van eindhosts.
    # Employee mag op switchniveau niet rechtstreeks naar guest.
    # Overige toegangsbeperkingen worden op de gateway afgehandeld.
    office-acl:
        - rule:
              description: "Employee -> guest verboden (IPv4)"
              dl_type: 0x800
              ipv4_dst: "10.0.200.0/24"
              actions:
                  allow: 0
        - rule:
              description: "Employee -> guest verboden (IPv6)"
              dl_type: 0x86dd
              ipv6_dst: "2001:db8:200::/64"
              actions:
                  allow: 0
        - rule:
              description: "Rest toegestaan"
              actions:
                  allow: 1

    # Guest mag alleen via de gateway naar buiten en krijgt 1 Mbit/s
    # per poort. Verkeer naar interne netwerken wordt expliciet geweigerd.
    guest-acl:
        - rule:
              description: "ARP toestaan"
              dl_type: 0x806
              actions:
                  allow: 1
        - rule:
              description: "IPv6 neighbour solicitation"
              dl_type: 0x86dd
              ip_proto: 58
              icmpv6_type: 135
              actions:
                  allow: 1
        - rule:
              description: "IPv6 neighbour advertisement"
              dl_type: 0x86dd
              ip_proto: 58
              icmpv6_type: 136
              actions:
                  allow: 1
        - rule:
              description: "Guest -> eigen gateway IPv4"
              dl_type: 0x800
              eth_dst: "02:00:00:00:fe:01"
              ipv4_dst: "10.0.200.254/32"
              actions:
                  meter: guest-rate-limit
                  allow: 1
        - rule:
              description: "Guest -> guest verboden (IPv4)"
              dl_type: 0x800
              ipv4_dst: "10.0.200.0/24"
              actions:
                  allow: 0
        - rule:
              description: "Guest -> employee verboden (IPv4)"
              dl_type: 0x800
              ipv4_dst: "10.0.100.0/23"
              actions:
                  allow: 0
        - rule:
              description: "Guest -> management verboden (IPv4)"
              dl_type: 0x800
              ipv4_dst: "10.0.30.0/24"
              actions:
                  allow: 0
        - rule:
              description: "Guest -> ISP via gateway (IPv4), rate limited"
              dl_type: 0x800
              eth_dst: "02:00:00:00:fe:01"
              actions:
                  meter: guest-rate-limit
                  allow: 1
        - rule:
              description: "Guest -> eigen gateway IPv6"
              dl_type: 0x86dd
              eth_dst: "02:00:00:00:fe:01"
              ipv6_dst: "2001:db8:200::1/128"
              actions:
                  meter: guest-rate-limit
                  allow: 1
        - rule:
              description: "Guest -> guest verboden (IPv6)"
              dl_type: 0x86dd
              ipv6_dst: "2001:db8:200::/64"
              actions:
                  allow: 0
        - rule:
              description: "Guest -> employee verboden (IPv6)"
              dl_type: 0x86dd
              ipv6_dst: "2001:db8:100::/64"
              actions:
                  allow: 0
        - rule:
              description: "Guest -> management verboden (IPv6)"
              dl_type: 0x86dd
              ipv6_dst: "2001:db8:300::/64"
              actions:
                  allow: 0
        - rule:
              description: "Guest -> ISP via gateway (IPv6), rate limited"
              dl_type: 0x86dd
              eth_dst: "02:00:00:00:fe:01"
              actions:
                  meter: guest-rate-limit
                  allow: 1
        - rule:
              description: "Al het andere droppen"
              actions:
                  allow: 0

    # Ethernet-port security voor management:
    # elke managementpoort accepteert slechts één vaste bron-MAC.
    port-security-a1-mgt:
        - rule:
              description: "Alleen a1_mgt"
              eth_src: "02:00:00:00:30:11"
              actions:
                  allow: 1
        - rule:
              description: "Overige MAC-adressen droppen"
              actions:
                  allow: 0
    port-security-a2-mgt:
        - rule:
              description: "Alleen a2_mgt"
              eth_src: "02:00:00:00:30:12"
              actions:
                  allow: 1
        - rule:
              description: "Overige MAC-adressen droppen"
              actions:
                  allow: 0
    port-security-b1-mgt:
        - rule:
              description: "Alleen b1_mgt"
              eth_src: "02:00:00:00:30:21"
              actions:
                  allow: 1
        - rule:
              description: "Overige MAC-adressen droppen"
              actions:
                  allow: 0
    port-security-b2-mgt:
        - rule:
              description: "Alleen b2_mgt"
              eth_src: "02:00:00:00:30:22"
              actions:
                  allow: 1
        - rule:
              description: "Overige MAC-adressen droppen"
              actions:
                  allow: 0
    port-security-b3-mgt:
        - rule:
              description: "Alleen b3_mgt"
              eth_src: "02:00:00:00:30:23"
              actions:
                  allow: 1
        - rule:
              description: "Overige MAC-adressen droppen"
              actions:
                  allow: 0

vlans:
    # Native VLAN's worden gebruikt op accesspoorten; op trunks zijn
    # dezelfde VLAN's als tagged VLAN toegestaan.
    office:
        vid: 100
        description: "Employee network 10.0.100.0/23 en 2001:db8:100::/64"
    guest:
        vid: 200
        description: "Guest network 10.0.200.0/24 en 2001:db8:200::/64"
    management:
        vid: 300
        description: "Management network 10.0.30.0/24 en 2001:db8:300::/64"

dps:
    # Elke datapath switch (DP) gebruikt een uniek datapath-ID.
    # Core-switches verbinden verdiepingen en de gateway; verdiepings-
    # switches verbinden de eindhosts met accesspoorten.
    a_core:
        dp_id: 0x1
        hardware: "Open vSwitch"
        interfaces:
            1:
                description: "Trunk naar a_f1"
                tagged_vlans: [office, guest, management]
            2:
                description: "Trunk naar a_f2"
                tagged_vlans: [office, guest, management]
            3:
                description: "Darkfiber naar b_core"
                tagged_vlans: [office, guest, management]
            4:
                description: "Trunk naar natgw (router, NAT en stateful firewall)"
                tagged_vlans: [office, guest, management]

    a_f1:
        dp_id: 0x2
        hardware: "Open vSwitch"
        interfaces:
            1:
                description: "Trunk naar a_core"
                tagged_vlans: [office, guest, management]
            2:
                description: "Employee a1_emp"
                native_vlan: office
                acls_in: [office-acl]
            3:
                description: "Guest a1_gst"
                native_vlan: guest
                acls_in: [guest-acl]
            4:
                description: "Management a1_mgt"
                native_vlan: management
                acls_in: [port-security-a1-mgt]

    a_f2:
        dp_id: 0x3
        hardware: "Open vSwitch"
        interfaces:
            1:
                description: "Trunk naar a_core"
                tagged_vlans: [office, guest, management]
            2:
                description: "Employee a2_emp"
                native_vlan: office
                acls_in: [office-acl]
            3:
                description: "Guest a2_gst"
                native_vlan: guest
                acls_in: [guest-acl]
            4:
                description: "Management a2_mgt"
                native_vlan: management
                acls_in: [port-security-a2-mgt]

    b_core:
        dp_id: 0x4
        hardware: "Open vSwitch"
        interfaces:
            1:
                description: "Trunk naar b_f1"
                tagged_vlans: [office, guest, management]
            2:
                description: "Trunk naar b_f2"
                tagged_vlans: [office, guest, management]
            3:
                description: "Trunk naar b_f3"
                tagged_vlans: [office, guest, management]
            4:
                description: "Darkfiber naar a_core"
                tagged_vlans: [office, guest, management]

    b_f1:
        dp_id: 0x5
        hardware: "Open vSwitch"
        interfaces:
            1:
                description: "Trunk naar b_core"
                tagged_vlans: [office, guest, management]
            2:
                description: "Employee b1_emp"
                native_vlan: office
                acls_in: [office-acl]
            3:
                description: "Guest b1_gst"
                native_vlan: guest
                acls_in: [guest-acl]
            4:
                description: "Management b1_mgt"
                native_vlan: management
                acls_in: [port-security-b1-mgt]

    b_f2:
        dp_id: 0x6
        hardware: "Open vSwitch"
        interfaces:
            1:
                description: "Trunk naar b_core"
                tagged_vlans: [office, guest, management]
            2:
                description: "Employee b2_emp"
                native_vlan: office
                acls_in: [office-acl]
            3:
                description: "Guest b2_gst"
                native_vlan: guest
                acls_in: [guest-acl]
            4:
                description: "Management b2_mgt"
                native_vlan: management
                acls_in: [port-security-b2-mgt]

    b_f3:
        dp_id: 0x7
        hardware: "Open vSwitch"
        interfaces:
            1:
                description: "Trunk naar b_core"
                tagged_vlans: [office, guest, management]
            2:
                description: "Employee b3_emp"
                native_vlan: office
                acls_in: [office-acl]
            3:
                description: "Guest b3_gst"
                native_vlan: guest
                acls_in: [guest-acl]
            4:
                description: "Management b3_mgt"
                native_vlan: management
                acls_in: [port-security-b3-mgt]